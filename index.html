<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Megmutatom Magam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6F1;
    --ink:#1F3A3D;
    --ink-soft:#5B6E6C;
    --accent:#E8604C;
    --accent-deep:#C94A38;
    --accent-soft:#F6D9C9;
    --gold:#E8A23D;
    --gold-soft:#FBE7C6;
    --locked:#DCD3C6;
    --locked-ink:#B3A897;
    --card:#FFFFFF;
    --line:#E7DCCB;
    --done:#3F7E6E;
    --done-soft:#DCEFE8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    min-height:100vh;
  }
  #app{max-width:430px;margin:0 auto;position:relative;min-height:100vh;}

  /* ---------- HEADER ---------- */
  header{
    position:sticky; top:0; z-index:30;
    background:rgba(250,246,241,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:14px 18px 12px;
  }
  .head-row{display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; flex-direction:column; line-height:1.1;}
  .brand-name{font-family:'Fraunces',serif; font-weight:600; font-size:19px; letter-spacing:-0.01em;}
  .brand-sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .stats{display:flex; gap:10px;}
  .stat-pill{
    display:flex; align-items:center; gap:5px;
    background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:6px 11px 6px 9px;
    font-size:13px; font-weight:700;
  }
  .stat-pill svg{width:15px;height:15px;flex-shrink:0;}
  .stat-pill.streak{color:var(--accent-deep);}
  .stat-pill.xp{color:#B9791F;}

  .progress-track{
    margin-top:12px; height:8px; border-radius:999px;
    background:var(--line); overflow:hidden;
  }
  .progress-fill{
    height:100%; border-radius:999px;
    background:linear-gradient(90deg, var(--accent), var(--gold));
    width:0%; transition:width .5s ease;
  }
  .progress-label{font-size:11px; color:var(--ink-soft); margin-top:6px; text-align:right;}

  /* ---------- PATH ---------- */
  #path-wrap{position:relative; padding:34px 0 90px;}
  svg#connector{position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none;}

  .month-banner{
    position:relative; z-index:2;
    margin:8px auto 30px; width:88%;
    background:var(--ink); color:#FAF6F1;
    border-radius:18px; padding:16px 20px;
    box-shadow:0 8px 18px -8px rgba(31,58,61,0.45);
  }
  .month-banner .m-eyebrow{font-size:11px; color:var(--gold-soft); font-weight:600;}
  .month-banner .m-title{font-family:'Fraunces',serif; font-size:18px; font-weight:600; margin-top:3px;}
  .month-banner .m-desc{font-size:12.5px; color:#C9D6D4; margin-top:5px; line-height:1.4;}

  .week-banner{
    position:relative; z-index:2;
    margin:26px auto 22px; width:82%;
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:12px 16px;
    text-align:center;
  }
  .week-banner .w-num{font-size:10.5px; font-weight:700; color:var(--accent-deep); letter-spacing:.02em;}
  .week-banner .w-goal{font-size:13px; font-weight:600; margin-top:4px; line-height:1.35; color:var(--ink);}

  .row{position:relative; z-index:2; display:flex; margin-bottom:26px;}
  .node-wrap{position:relative;}
  .node{
    width:60px; height:60px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:none; cursor:pointer; position:relative;
    font-family:'Fraunces',serif; font-weight:600; font-size:17px;
    box-shadow:0 4px 0 rgba(0,0,0,0.12);
    transition:transform .12s ease;
  }
  .node:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,0.12);}
  .node.locked{background:var(--locked); color:var(--locked-ink); box-shadow:0 4px 0 #C9BEAE; cursor:default;}
  .node.locked:active{transform:none; box-shadow:0 4px 0 #C9BEAE;}
  .node.today{background:var(--accent); color:#fff; box-shadow:0 4px 0 var(--accent-deep);}
  .node.done{background:var(--done); color:#fff; box-shadow:0 4px 0 #2C5B4F;}
  .node.rest{background:var(--gold-soft); color:#9C6B1E; box-shadow:0 4px 0 #E0BE86;}
  .node.rest.done{background:var(--done); color:#fff; box-shadow:0 4px 0 #2C5B4F;}
  .node-daynum{position:absolute; bottom:-19px; left:50%; transform:translateX(-50%); font-size:10px; color:var(--ink-soft); font-weight:600; white-space:nowrap;}
  .today-badge{
    position:absolute; top:-13px; left:50%; transform:translateX(-50%);
    background:var(--accent-deep); color:#fff; font-size:9px; font-weight:700;
    padding:3px 8px; border-radius:999px; white-space:nowrap; letter-spacing:.02em;
  }
  .node svg{width:24px;height:24px;}

  .final-banner{
    position:relative; z-index:2; margin:30px auto 10px; width:85%;
    background:linear-gradient(160deg, var(--accent-soft), var(--gold-soft));
    border-radius:20px; padding:22px 20px; text-align:center;
    border:1px solid var(--line);
  }
  .final-banner .f-emoji{font-size:30px;}
  .final-banner .f-title{font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin-top:6px;}
  .final-banner .f-desc{font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.4;}

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(31,29,25,0.42);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:100; opacity:0; pointer-events:none; transition:opacity .25s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    width:100%; max-width:430px; background:var(--card);
    border-radius:22px 22px 0 0; padding:22px 22px 26px;
    transform:translateY(24px); transition:transform .28s cubic-bezier(.2,.8,.3,1);
    box-shadow:0 -10px 30px rgba(0,0,0,0.15);
  }
  .overlay.show .sheet{transform:translateY(0);}
  .sheet-handle{width:36px; height:4px; background:var(--line); border-radius:999px; margin:0 auto 16px;}
  .sheet-eyebrow{font-size:11px; font-weight:700; color:var(--accent-deep); letter-spacing:.02em;}
  .sheet-title{font-family:'Fraunces',serif; font-size:19px; font-weight:600; margin-top:5px; line-height:1.3;}
  .sheet-week{font-size:12px; color:var(--ink-soft); margin-top:8px; line-height:1.45; background:var(--bg); padding:10px 12px; border-radius:10px;}
  .sheet-actions{display:flex; gap:10px; margin-top:20px;}
  .btn{
    flex:1; border:none; border-radius:14px; padding:14px 10px;
    font-family:'Inter',sans-serif; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .btn-close{background:var(--bg); color:var(--ink-soft); border:1px solid var(--line);}
  .btn-done{background:var(--done); color:#fff; box-shadow:0 4px 0 #2C5B4F;}
  .btn-done:active{transform:translateY(3px); box-shadow:none;}
  .btn-undo{background:var(--accent-soft); color:var(--accent-deep);}
  .locked-note{font-size:12.5px; color:var(--ink-soft); margin-top:14px; line-height:1.5; text-align:center;}

  .toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px;
    font-size:13.5px; font-weight:600; z-index:200; opacity:0; transition:all .3s ease;
    pointer-events:none; white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>

/* ---------------- STATE ---------------- */
let completed = new Set();
let xp = 0;
let streak = 0;
const STORAGE_KEY = "progress-v1";

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      completed = new Set(parsed.completed || []);
      xp = parsed.xp || 0;
      streak = parsed.streak || 0;
    }
  }catch(e){ /* nincs még mentett adat, vagy a böngésző blokkolja a tárolást */ }
  render();
}

function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      completed:[...completed], xp, streak
    }));
  }catch(e){ console.error("Mentési hiba", e); }
}

function firstIncomplete(){
  for(const day of DAYS){ if(!completed.has(day.d)) return day.d; }
  return DAYS[DAYS.length-1].d + 1;
}

/* ---------------- RENDER ---------------- */

const PATTERN = [0, 34, 52, 34, 0, -34, -52, -34]; // zigzag offset px

  rowsEl.innerHTML = "";
  const current = firstIncomplete();
  let lastMonth = 0, lastWeek = 0;
  const coords = [];

  DAYS.forEach((day, idx) => {
    if(day.m !== lastMonth){
      lastMonth = day.m;
      const meta = MONTH_META[day.m];
      const banner = document.createElement('div');
      banner.className = 'month-banner';
      banner.innerHTML = `<div class="m-eyebrow">${day.m}. HÓNAP</div>
        <div class="m-title">${meta.title}</div>
        <div class="m-desc">${meta.desc}</div>`;
      rowsEl.appendChild(banner);
    }
    if(day.w !== lastWeek){
      lastWeek = day.w;
      const wm = WEEK_META[day.w];
      const wb = document.createElement('div');
      wb.className = 'week-banner';
      wb.innerHTML = `<div class="w-num">${wm.label.toUpperCase()}</div><div class="w-goal">${wm.goal}</div>`;
      rowsEl.appendChild(wb);
    }

    const row = document.createElement('div');
    row.className = 'row';
    const offset = PATTERN[idx % PATTERN.length];
    row.style.justifyContent = 'center';

    const wrap = document.createElement('div');
    wrap.className = 'node-wrap';
    wrap.style.transform = `translateX(${offset}px)`;

    const isDone = completed.has(day.d);
    const isLocked = day.d > current;
    const isToday = day.d === current && !isDone;

    const btn = document.createElement('button');
    btn.className = 'node' + (day.type===REST ? ' rest' : '') + (isDone ? ' done' : (isLocked ? ' locked' : (isToday ? ' today' : '')));
    btn.setAttribute('data-day', day.d);

    let icon;
    if(isDone){
      icon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`;
    } else if(isLocked){
      icon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 10V8a6 6 0 1112 0v2h1a1 1 0 011 1v9a1 1 0 01-1 1H5a1 1 0 01-1-1v-9a1 1 0 011-1h1zm2 0h8V8a4 4 0 00-8 0v2z"/></svg>`;
    } else if(day.type===REST){
      icon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3a9 9 0 109 9 7 7 0 01-9-9z"/></svg>`;
    } else {
      icon = `${day.d}`;
    }
    btn.innerHTML = icon;

    const num = document.createElement('div');
    num.className = 'node-daynum';
    num.textContent = day.d + '. nap';
    wrap.appendChild(btn);
    wrap.appendChild(num);
    if(isToday){
      const badge = document.createElement('div');
      badge.className = 'today-badge';
      badge.textContent = 'MA';
      wrap.appendChild(badge);
    }
    row.appendChild(wrap);
    rowsEl.appendChild(row);

    btn.addEventListener('click', () => openSheet(day, isLocked, isDone));
  });

  const final = document.createElement('div');
  final.className = 'final-banner';
  final.innerHTML = `<div class="f-emoji">🏆</div>
    <div class="f-title">90. nap</div>
    <div class="f-desc">Nem az a cél, hogy megszűnjön izgulni. Az a cél, hogy az izgalom ellenére is megcsináld.</div>`;
  rowsEl.appendChild(final);

  document.getElementById('streak-count').textContent = streak;
  document.getElementById('xp-count').textContent = xp;
  const doneCount = completed.size;
  document.getElementById('progress-fill').style.width = (doneCount/90*100) + '%';
  document.getElementById('progress-label').textContent = `${doneCount} / 90 nap kész`;

  requestAnimationFrame(drawConnector);
}

function drawConnector(){
  const svg = document.getElementById('connector');
  const wrapEl = document.getElementById('path-wrap');
  const nodeWraps = [...document.querySelectorAll('.node-wrap')];
  if(nodeWraps.length < 2){ svg.innerHTML=''; return; }
  const baseRect = wrapEl.getBoundingClientRect();
  svg.setAttribute('height', wrapEl.offsetHeight);
  const pts = nodeWraps.map(el => {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width/2 - baseRect.left, y: r.top + r.height/2 - baseRect.top };
  });
  let d = `M ${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++){
    const p0 = pts[i-1], p1 = pts[i];
    const midY = (p0.y + p1.y)/2;
    d += ` C ${p0.x} ${midY}, ${p1.x} ${midY}, ${p1.x} ${p1.y}`;
  }
  svg.innerHTML = `<path d="${d}" fill="none" stroke="#E7DCCB" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 14"/>`;
}
window.addEventListener('resize', () => requestAnimationFrame(drawConnector));

/* ---------------- SHEET / MODAL ---------------- */
const overlay = document.getElementById('overlay');
let activeDay = null;

function openSheet(day, isLocked, isDone){
  activeDay = day;
  document.getElementById('sheet-eyebrow').textContent = WEEK_META[day.w].label.toUpperCase() + ` · ${day.d}. NAP`;
  document.getElementById('sheet-title').textContent = day.t;
  document.getElementById('sheet-week').textContent = "Heti cél: " + WEEK_META[day.w].goal;

  const body = document.getElementById('sheet-body');
  if(isLocked){
    body.innerHTML = `<div class="locked-note">Ez a nap még zárva van. Előbb fejezd be az előző napokat — nem kell sietni.</div>
      <div class="sheet-actions"><button class="btn btn-close" id="btn-close">Bezárás</button></div>`;
  } else if(isDone){
    body.innerHTML = `<div class="sheet-actions">
      <button class="btn btn-undo" id="btn-undo">Mégsem kész</button>
      <button class="btn btn-close" id="btn-close">Bezárás</button>
    </div>`;
  } else {
    body.innerHTML = `<div class="sheet-actions">
      <button class="btn btn-close" id="btn-close">Bezárás</button>
      <button class="btn btn-done" id="btn-done">Kész vagyok</button>
    </div>`;
  }
  overlay.classList.add('show');

  document.getElementById('btn-close').onclick = closeSheet;
  const doneBtn = document.getElementById('btn-done');
  if(doneBtn) doneBtn.onclick = () => markDone(day);
  const undoBtn = document.getElementById('btn-undo');
  if(undoBtn) undoBtn.onclick = () => markUndo(day);
}
function closeSheet(){ overlay.classList.remove('show'); }
overlay.addEventListener('click', e => { if(e.target === overlay) closeSheet(); });

function markDone(day){
  completed.add(day.d);
  xp += (day.type===REST ? 5 : 10);
  streak += 1;
  saveState();
  closeSheet();
  showToast(day.type===REST ? "Megvan! +5 XP" : "Szép munka! +10 XP");
  render();
}
function markUndo(day){
  completed.delete(day.d);
  streak = Math.max(0, streak - 1);
  saveState();
  closeSheet();
  render();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

loadState();
</script>
